<html>


<head>

    <meta charset="UTF-8">

    <title>Shopping Cart - Online Bookstore</title>

    <style>
        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 0;

            background-color: #f4f4f4;

        }

        nav {

            background-color: #333;

            padding: 15px;

            text-align: center;

        }

        nav a {

            color: white;

            margin: 0 10px;

            text-decoration: none;

            font-weight: bold;

        }

        .cart-container {

            max-width: 500px;

            margin: 30px auto;

            background: white;

            padding: 20px;

            border-radius: 8px;

            box-shadow: 5px 5px 10px gray;

        }

        .cart-item {

            display: flex;

            justify-content: space-between;

            border-bottom: 1px solid #ddd;

            padding: 10px 0;

        }

        .total {

            font-size: 18px;

            font-weight: bold;

            margin-top: 15px;

            text-align: right;

        }

        .checkout-btn {

            background-color: #28a745;

            color: white;

            border: none;

            padding: 10px;

            width: 100%;

            margin-top: 15px;

            cursor: pointer;

            border-radius: 4px;

            font-size: 16px;

        }
    </style>

</head>

<body>

    <nav>
        <a href="index.html">home</a>
        <a href="books.html">books</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">contact</a>
    </nav>

    <h2 style="text-align: center;">Your Shopping Cart</h2>

    <div class="cart-container">
        <div class="cart-item">
            <span>Chronicles of Narnia(x1)</span>
            <span>$2</span>
        </div>

        <div class="cart-container">
            <div class="cart-item">
                <span>Series of unfortunate events(x1)</span>
                <span>$2</span>
            </div>

            <div class="total">Total: $4</div>

            <button class="checkout-btn" onclick="alert('Proceding to checkout!')">Proceding to checkout</button>

        </div>
</body>

</html>
